name = "jitthub"
main = "jitt_hub/worker.js"
compatibility_date = "2026-08-13"
# A Cloudflare dashboardon tárolt változók és titkok deploykor is megmaradnak.
keep_vars = true
workers_dev = true
secrets = { required = ["SUPABASE_URL", "SUPABASE_READ_KEY"] }

[vars]
PWA_API_URL = "https://jittfutar.onrender.com"

[assets]
directory = "./jitt_hub"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
