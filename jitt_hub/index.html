<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10251a" />
    <title>JITT Hub | Bejelentkezés</title>
    <meta name="description" content="JITT Hub belső bejelentkező oldal." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-hero" aria-labelledby="login-title">
        <div class="brand">
          <span class="brand-mark">J</span>
          <span>JITT Hub</span>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">BELSŐ HOZZÁFÉRÉS</p>
          <h1 id="login-title">Futár 360 indulópont.</h1>
          <p>
            Egy közös belépési felület a későbbi műszak, túra és elszámolási
            nézetekhez.
          </p>
        </div>

        <div class="signal-grid" aria-label="Tervezett modulok">
          <div>
            <strong>Hub</strong>
            <span>Műszakok</span>
          </div>
          <div>
            <strong>Excel</strong>
            <span>Elszámolás</span>
          </div>
          <div>
            <strong>360</strong>
            <span>Futár nézet</span>
          </div>
        </div>
      </section>

      <section class="login-panel">
        <form class="login-card" id="login-form">
          <p class="eyebrow">JITT HUB</p>
          <h2>Bejelentkezés</h2>
          <p class="muted">Első körben ez csak a tiszta belépőoldal sablonja.</p>

          <label for="email">E-mail cím</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="nev@jitt.hu" required />

          <label for="password">Jelszó</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Jelszó" required />
            <button id="toggle-password" type="button">Mutat</button>
          </div>

          <label class="remember">
            <input id="remember" type="checkbox" />
            <span>Emlékezz rám ezen az eszközön</span>
          </label>

          <p class="message" id="message" aria-live="polite"></p>
          <button class="primary-action" type="submit">Belépés</button>
        </form>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
