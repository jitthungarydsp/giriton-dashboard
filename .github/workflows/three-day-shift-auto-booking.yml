name: Three Day Shift Auto Booking

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Opcionális kezdőnap YYYY-MM-DD. Üresen: holnap."
        required: false
        default: ""
      days:
        description: "Hány napot nézzen a kezdőnaptól. Alap: 3."
        required: false
        default: "3"
      exact_limit:
        description: "Maximum hány pontos egyezést foglaljon egy futásban."
        required: false
        default: "50"
      alternative_limit:
        description: "Maximum hány alternatívát foglaljon egy futásban."
        required: false
        default: "50"
      dry_run:
        description: "true = csak kiválasztás/ellenőrzés, false = éles foglalás"
        required: false
        default: "false"
      booking_engine:
        description: "uidl = új út, robot = régi képernyős tartalék"
        required: false
        default: "uidl"
      raw_export_engine:
        description: "uidl = új gyors Giriton frissítés, robot = régi UI végignyomkodás"
        required: false
        default: "uidl"
  schedule:
    # GitHub cron UTC-ben fut. Ez a lánc saját maga frissít és csak holnaptól néz 3 napot.
    - cron: "5 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: three-day-shift-auto-booking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)

      - name: Resolve window
        shell: bash
        run: |
          START_DATE="${{ inputs.start_date }}"
          DAYS="${{ inputs.days }}"
          EXACT_LIMIT="${{ inputs.exact_limit }}"
          ALTERNATIVE_LIMIT="${{ inputs.alternative_limit }}"
          DRY_RUN="${{ inputs.dry_run }}"
          BOOKING_ENGINE="${{ inputs.booking_engine }}"
          RAW_EXPORT_ENGINE="${{ inputs.raw_export_engine }}"

          START_DATE="${START_DATE:-}"
          DAYS="${DAYS:-3}"
          EXACT_LIMIT="${EXACT_LIMIT:-50}"
          ALTERNATIVE_LIMIT="${ALTERNATIVE_LIMIT:-50}"
          DRY_RUN="${DRY_RUN:-false}"
          BOOKING_ENGINE="${BOOKING_ENGINE:-uidl}"
          RAW_EXPORT_ENGINE="${RAW_EXPORT_ENGINE:-uidl}"

          if [ -z "$START_DATE" ]; then
            START_DATE="$(python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("Europe/Budapest")).date() + timedelta(days=1)).isoformat())')"
          fi

          echo "SHIFT_AUTO_START_DATE=$START_DATE" >> "$GITHUB_ENV"
          echo "SHIFT_AUTO_DAYS=$DAYS" >> "$GITHUB_ENV"
          echo "SHIFT_AUTO_EXACT_LIMIT=$EXACT_LIMIT" >> "$GITHUB_ENV"
          echo "SHIFT_AUTO_ALTERNATIVE_LIMIT=$ALTERNATIVE_LIMIT" >> "$GITHUB_ENV"
          echo "SHIFT_AUTO_DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "SHIFT_AUTO_BOOK_ENGINE=$BOOKING_ENGINE" >> "$GITHUB_ENV"
          echo "SHIFT_AUTO_RAW_EXPORT_ENGINE=$RAW_EXPORT_ENGINE" >> "$GITHUB_ENV"
          echo "SHIFT_AUTO_WINDOW start=$START_DATE days=$DAYS dry_run=$DRY_RUN booking_engine=$BOOKING_ENGINE raw_export_engine=$RAW_EXPORT_ENGINE"

      - name: Refresh MuszakPro bookings
        shell: bash
        run: |
          CMD=(python scripts/refresh_next_5_day_attendance_muszakpro.py --start-date "$SHIFT_AUTO_START_DATE" --days "$SHIFT_AUTO_DAYS")
          if [ "$SHIFT_AUTO_DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Refresh Giriton before booking
        shell: bash
        run: |
          if [ "$SHIFT_AUTO_DRY_RUN" = "true" ]; then
            echo "Dry-run: Giriton DB frissites kihagyva."
            exit 0
          fi
          if [ "$SHIFT_AUTO_RAW_EXPORT_ENGINE" = "uidl" ]; then
            python scripts/live_giriton_shift_list.py \
              --start-date "$SHIFT_AUTO_START_DATE" \
              --days "$SHIFT_AUTO_DAYS" \
              --source uidl \
              --fast-uidl \
              --uidl-dir results/three-day-shift-auto-booking/giriton-before/uidl-trace \
              --csv results/three-day-shift-auto-booking/giriton-before/giriton-live-shifts.csv \
              --write-raw-export
          else
            robot \
              --outputdir results/three-day-shift-auto-booking/giriton-before \
              --variable "RUN_START_DATE:$SHIFT_AUTO_START_DATE" \
              --variable "DAYS_TO_SYNC:$SHIFT_AUTO_DAYS" \
              giriton_raw_export_github.robot
          fi
          python scripts/refresh_shift_comparison.py --start-date "$SHIFT_AUTO_START_DATE" --days "$SHIFT_AUTO_DAYS"

      - name: Select exact matches
        shell: bash
        run: |
          python scripts/select_shift_auto_booking_candidates.py \
            --start-date "$SHIFT_AUTO_START_DATE" \
            --days "$SHIFT_AUTO_DAYS" \
            --match-kind exact \
            --limit "$SHIFT_AUTO_EXACT_LIMIT" \
            --output results/three-day-shift-auto-booking/exact-candidates.json

      - name: Book exact matches
        shell: bash
        run: |
          CMD=(python scripts/run_shift_auto_booking_candidates.py \
            --candidate-file results/three-day-shift-auto-booking/exact-candidates.json \
            --output-root results/three-day-shift-auto-booking/exact \
            --phase exact \
            --engine "$SHIFT_AUTO_BOOK_ENGINE" \
            --continue-on-error)
          if [ "$SHIFT_AUTO_DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Refresh and verify exact matches
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "$SHIFT_AUTO_DRY_RUN" = "true" ]; then
            echo "Dry-run: exact DB visszafrissites es ellenorzes kihagyva."
            exit 0
          fi
          if [ "$SHIFT_AUTO_RAW_EXPORT_ENGINE" = "uidl" ]; then
            python scripts/live_giriton_shift_list.py \
              --start-date "$SHIFT_AUTO_START_DATE" \
              --days "$SHIFT_AUTO_DAYS" \
              --source uidl \
              --fast-uidl \
              --uidl-dir results/three-day-shift-auto-booking/giriton-after-exact/uidl-trace \
              --csv results/three-day-shift-auto-booking/giriton-after-exact/giriton-live-shifts.csv \
              --write-raw-export
          else
            robot \
              --outputdir results/three-day-shift-auto-booking/giriton-after-exact \
              --variable "RUN_START_DATE:$SHIFT_AUTO_START_DATE" \
              --variable "DAYS_TO_SYNC:$SHIFT_AUTO_DAYS" \
              giriton_raw_export_github.robot
          fi
          python scripts/refresh_shift_comparison.py --start-date "$SHIFT_AUTO_START_DATE" --days "$SHIFT_AUTO_DAYS"
          python scripts/verify_shift_auto_booking_candidates.py \
            --candidate-file results/three-day-shift-auto-booking/exact-candidates.json \
            --phase exact

      - name: Select alternative matches
        if: ${{ always() }}
        shell: bash
        run: |
          python scripts/select_shift_auto_booking_candidates.py \
            --start-date "$SHIFT_AUTO_START_DATE" \
            --days "$SHIFT_AUTO_DAYS" \
            --match-kind alternative \
            --limit "$SHIFT_AUTO_ALTERNATIVE_LIMIT" \
            --output results/three-day-shift-auto-booking/alternative-candidates.json

      - name: Book alternative matches
        if: ${{ always() }}
        shell: bash
        run: |
          CMD=(python scripts/run_shift_auto_booking_candidates.py \
            --candidate-file results/three-day-shift-auto-booking/alternative-candidates.json \
            --output-root results/three-day-shift-auto-booking/alternative \
            --phase alternative \
            --engine "$SHIFT_AUTO_BOOK_ENGINE" \
            --continue-on-error)
          if [ "$SHIFT_AUTO_DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Refresh and verify alternative matches
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "$SHIFT_AUTO_DRY_RUN" = "true" ]; then
            echo "Dry-run: alternative DB visszafrissites es ellenorzes kihagyva."
            exit 0
          fi
          if [ "$SHIFT_AUTO_RAW_EXPORT_ENGINE" = "uidl" ]; then
            python scripts/live_giriton_shift_list.py \
              --start-date "$SHIFT_AUTO_START_DATE" \
              --days "$SHIFT_AUTO_DAYS" \
              --source uidl \
              --fast-uidl \
              --uidl-dir results/three-day-shift-auto-booking/giriton-after-alternative/uidl-trace \
              --csv results/three-day-shift-auto-booking/giriton-after-alternative/giriton-live-shifts.csv \
              --write-raw-export
          else
            robot \
              --outputdir results/three-day-shift-auto-booking/giriton-after-alternative \
              --variable "RUN_START_DATE:$SHIFT_AUTO_START_DATE" \
              --variable "DAYS_TO_SYNC:$SHIFT_AUTO_DAYS" \
              giriton_raw_export_github.robot
          fi
          python scripts/refresh_shift_comparison.py --start-date "$SHIFT_AUTO_START_DATE" --days "$SHIFT_AUTO_DAYS"
          python scripts/verify_shift_auto_booking_candidates.py \
            --candidate-file results/three-day-shift-auto-booking/alternative-candidates.json \
            --phase alternative

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-day-shift-auto-booking-results
          path: results/three-day-shift-auto-booking
