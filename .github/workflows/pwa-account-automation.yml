name: PWA_ACCOUNT_AUTOMATION
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      enqueue_existing:
        description: 'Korábbi nyitott kérelmek felvétele is (típusonként legfeljebb 100)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pwa-account-automation
  cancel-in-progress: false
jobs:
  process:
    # Enable only after the SQL migration and password-setup PWA deployment.
    if: vars.PWA_ACCOUNT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PWA_ACCOUNT_AUTOMATION_ENABLED: 'true'
      PWA_PUBLIC_URL: ${{ vars.PWA_PUBLIC_URL || 'https://futar.jitt.hu' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_USE_SSL: 'false'
      SMTP_USE_STARTTLS: 'true'
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_USERNAME }}
      SMTP_FROM_NAME: JittFutár
      ENQUEUE_EXISTING: ${{ inputs.enqueue_existing && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /resources/
            /scripts/run_pwa_account_worker.py
            /requirements-account-worker.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-account-worker.txt
      - name: Validate configuration
        run: |
          python - <<'PY'
          import os
          required = ['SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY', 'SMTP_USERNAME', 'SMTP_PASSWORD']
          missing = [key for key in required if not os.environ.get(key, '').strip()]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          PY
      - name: Install account worker dependencies
        run: pip install -r requirements-account-worker.txt
      - name: Process pending requests once
        run: |
          if [ "$ENQUEUE_EXISTING" = 'true' ]; then
            python scripts/run_pwa_account_worker.py --once --enqueue-existing
          else
            python scripts/run_pwa_account_worker.py --once
          fi
