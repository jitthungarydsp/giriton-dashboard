name: GIRITON_OVERLAP_FALLBACK

on:
  workflow_run:
    workflows: ["HUB_JOB_AUTOBOOKING"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Opcionális HUB_JOB_AUTOBOOKING run ID újrafeldolgozáshoz"
        required: true
        default: ""
      max_items:
        description: "Maximális OVERLAP jelölt; üresen mind"
        required: false
        default: ""
      dry_run:
        description: "true = csak ellenőrzés, false = éles Giriton foglalás"
        required: true
        default: "false"

concurrency:
  group: giriton-overlap-fallback-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  fallback:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)

      - name: Download Hub overlap artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id || inputs.source_run_id }}"
          test -n "$RUN_ID" || (echo "Missing source HUB_JOB_AUTOBOOKING run ID" && exit 1)
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name hub-job-autobooking-results \
            --dir results/hub-job-autobooking
          test -f results/hub-job-autobooking/failures.json

      - name: Run Giriton overlap fallback batch
        shell: bash
        run: |
          CMD=(python scripts/run_giriton_overlap_fallback.py \
            --input results/hub-job-autobooking/failures.json \
            --output-dir results/giriton-overlap-fallback \
            --trace-dir results/giriton-overlap-fallback/uidl-trace)
          if [ -n "${{ inputs.max_items }}" ]; then CMD+=(--max-items "${{ inputs.max_items }}"); fi
          SOURCE_DRY_RUN="$(python -c 'import json; from pathlib import Path; p=Path("results/hub-job-autobooking/run-config.json"); print(json.loads(p.read_text()).get("dry_run", "false") if p.exists() else "false")')"
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "$SOURCE_DRY_RUN" = "true" ]; then CMD+=(--dry-run); fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Sync ROBOTLOG sheet
        if: always()
        shell: bash
        run: |
          DRY_RUN="$(python -c 'import json; from pathlib import Path; print(str(json.loads(Path("results/giriton-overlap-fallback/summary.json").read_text()).get("dry_run", False)).lower())')"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run; ROBOTLOG sync skipped."
            exit 0
          fi
          COUNT="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("results/giriton-overlap-fallback/summary.json").read_text())["candidate_count"])')"
          if [ "$COUNT" = "0" ]; then
            echo "No OVERLAP candidates; ROBOTLOG sync skipped."
            exit 0
          fi
          python scripts/sync_giriton_robotlog_sheet.py \
            --start-date "$(python -c 'import json; from pathlib import Path; d=json.loads(Path("results/giriton-overlap-fallback/summary.json").read_text()); print(min((x["date"] for x in d["results"]), default=""))')" \
            --end-date "$(python -c 'import json; from pathlib import Path; d=json.loads(Path("results/giriton-overlap-fallback/summary.json").read_text()); print(max((x["date"] for x in d["results"]), default=""))')"

      - name: Upload overlap fallback artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giriton-overlap-fallback-results
          path: results/giriton-overlap-fallback

  refresh_hub_after_giriton:
    name: Refresh Hub and PWA after Giriton fallback
    needs: fallback
    if: ${{ needs.fallback.result == 'success' && (github.event_name == 'workflow_run' || inputs.dry_run != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      COURIER_HUB_COOKIE: ${{ secrets.COURIER_HUB_COOKIE }}
      COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      COURIER_HUB_AUTH_CACHE_FILE: /tmp/giriton-overlap-hub-auth.json
      COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --cache-file /tmp/giriton-overlap-hub-auth.json --debug-dir results/giriton-overlap-after-hub/auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download fallback summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name giriton-overlap-fallback-results \
            --dir results/giriton-overlap-fallback
          test -f results/giriton-overlap-fallback/summary.json

      - name: Refresh Hub tables and PWA comparison
        shell: bash
        run: |
          read -r START_DATE END_DATE COUNT < <(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("results/giriton-overlap-fallback/summary.json").read_text())
          dates = [str(row["date"]) for row in data.get("results", []) if row.get("date")]
          if not dates:
              print("  0")
          else:
              print(data.get("start_date") or min(dates), data.get("end_date") or max(dates), len(dates))
          PY
          )
          DRY_RUN="$(python -c 'import json; from pathlib import Path; print(str(json.loads(Path("results/giriton-overlap-fallback/summary.json").read_text()).get("dry_run", False)).lower())')"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run; Hub/PWA refresh skipped."
            exit 0
          fi
          if [ "$COUNT" = "0" ] || [ -z "$START_DATE" ] || [ -z "$END_DATE" ]; then
            echo "No Giriton fallback candidates; Hub/PWA refresh skipped."
            exit 0
          fi

          python scripts/refresh_ops_shift_comparison_from_hub.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --warehouse-ids "1,2" \
            --dsp-id 8 \
            --limit 100 \
            --output-dir results/giriton-overlap-after-hub/shift-auto-candidates

          python scripts/refresh_pwa_schedule_capacity_calendar.py \
            --warehouse-ids "1,2" \
            --dsp-id 8 \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --refresh-source "GIRITON_OVERLAP_AFTER_HUB_REFRESH"

          python scripts/refresh_muszakpro_booking_identity_matches.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE"

          python scripts/export_booking_diagnostics_sheet.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE"

      - name: Upload Hub refresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giriton-overlap-after-hub-refresh-results
          path: results/giriton-overlap-after-hub
