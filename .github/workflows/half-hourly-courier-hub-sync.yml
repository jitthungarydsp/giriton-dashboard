name: Half Hourly Courier Hub Sync

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Ev, pelda: 2026. Uresen: aktualis ev Budapest szerint."
        required: false
        default: ""
      month:
        description: "Honap 1-12. Uresen: aktualis honap Budapest szerint."
        required: false
        default: ""
      dry_run:
        description: "true eseten nem ir DB-be."
        required: false
        default: "false"
  schedule:
    # GitHub cron UTC-ben fut. Felorankent friss Courier Hub auth + route adatok.
    - cron: "*/30 * * * *"

concurrency:
  group: half-hourly-courier-hub-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      COURIER_HUB_COOKIE: ${{ secrets.COURIER_HUB_COOKIE }}
      COURIER_HUB_AUTHORIZATION: ${{ secrets.COURIER_HUB_AUTHORIZATION }}
      COURIER_HUB_API_KEY: ${{ secrets.COURIER_HUB_API_KEY }}
      COURIER_HUB_AUTH_DEBUG_DIR: results/courier-hub-auth
      COURIER_HUB_AUTH_CACHE_FILE: /tmp/courier-hub-auth.json
      COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --debug-dir results/courier-hub-auth --cache-file /tmp/courier-hub-auth.json
      KIFLI_COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      KIFLI_COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      KIFLI_COURIER_HUB_AUTH_CACHE_FILE: /tmp/courier-hub-auth.json
      KIFLI_COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --debug-dir results/courier-hub-auth --cache-file /tmp/courier-hub-auth.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          if [ -z "$COURIER_HUB_USERNAME" ] || [ -z "$COURIER_HUB_PASSWORD" ]; then
            if [ -z "$COURIER_HUB_COOKIE" ] && [ -z "$COURIER_HUB_AUTHORIZATION" ]; then
              echo "Missing Courier Hub auth. Add COURIER_HUB_USERNAME and COURIER_HUB_PASSWORD secrets."
              exit 1
            fi
          fi

      - name: Resolve period
        id: period
        shell: bash
        run: |
          YEAR="${{ inputs.year }}"
          MONTH="${{ inputs.month }}"
          DRY_RUN="${{ inputs.dry_run }}"

          YEAR="${YEAR:-$(TZ=Europe/Budapest date +%Y)}"
          MONTH="${MONTH:-$(TZ=Europe/Budapest date +%-m)}"
          DRY_RUN="${DRY_RUN:-false}"

          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          echo "YEAR=$YEAR"
          echo "MONTH=$MONTH"
          echo "DRY_RUN=$DRY_RUN"

      - name: Refresh Courier Hub auth
        shell: bash
        run: |
          if [ -n "$COURIER_HUB_USERNAME$COURIER_HUB_PASSWORD$COURIER_HUB_COOKIE$COURIER_HUB_AUTHORIZATION" ]; then
            python scripts/refresh_courier_hub_auth.py \
              --debug-dir results/courier-hub-auth \
              --cache-file "$COURIER_HUB_AUTH_CACHE_FILE" \
              > /tmp/courier-hub-auth-output.json
          else
            echo "Courier Hub login secrets not set, using static auth secrets."
          fi

      - name: Probe Courier Hub live monitoring dashboard
        shell: bash
        run: |
          python scripts/probe_courier_hub_live_monitoring.py --warehouse-id 2 --dsp-id 8

      - name: Resolve missing-day range
        id: days
        shell: bash
        run: |
          OUTPUT_FILE="$(mktemp)"
          python - <<'PY' > "$OUTPUT_FILE"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import requests

          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          supabase_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
          }
          tables = ("raw_jitt_invoice_perf_bud1", "raw_jitt_invoice_perf_bud2")
          latest_dates = []

          for table in tables:
              response = requests.get(
                  f"{supabase_url}/rest/v1/{table}",
                  headers=headers,
                  params={
                      "select": "date_to",
                      "source_name": "eq.courier_hub_performance_couriers",
                      "status_code": "eq.200",
                      "order": "date_to.desc",
                      "limit": "1",
                  },
                  timeout=30,
              )
              response.raise_for_status()
              rows = response.json()
              if rows and rows[0].get("date_to"):
                  latest_dates.append(datetime.strptime(rows[0]["date_to"][:10], "%Y-%m-%d").date())

          today = datetime.now(ZoneInfo("Europe/Budapest")).date()
          month_start = datetime.strptime(
              "${{ steps.period.outputs.year }}-${{ steps.period.outputs.month }}-01",
              "%Y-%m-%d",
          ).date()

          if latest_dates:
              start_date = min(latest_dates) + timedelta(days=1)
          else:
              start_date = month_start

          if start_date < month_start:
              start_date = month_start

          skip = start_date > today
          print(f"start_date={start_date.isoformat()}")
          print(f"end_date={today.isoformat()}")
          print(f"skip={'true' if skip else 'false'}")
          PY

          cat "$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
          cat "$OUTPUT_FILE"

      - name: Sync missing daily Courier Hub performance raw
        if: steps.days.outputs.skip != 'true'
        shell: bash
        run: |
          CMD=(python scripts/load_jitt_invoice_performance_raw.py --start-date "${{ steps.days.outputs.start_date }}" --end-date "${{ steps.days.outputs.end_date }}" --chunk-days 1 --only-missing)

          if [ "${{ steps.period.outputs.dry_run }}" = "true" ]; then
            CMD+=(--dry-run)
          fi

          "${CMD[@]}"

      - name: Build daily courier performance rows
        if: steps.days.outputs.skip != 'true'
        shell: bash
        run: |
          CMD=(python scripts/build_jitt_invoice_performance_daily_raw.py --start-date "${{ steps.days.outputs.start_date }}" --end-date "${{ steps.days.outputs.end_date }}")

          if [ "${{ steps.period.outputs.dry_run }}" = "true" ]; then
            CMD+=(--dry-run)
          fi

          "${CMD[@]}"

      - name: Sync Courier Hub shift overview for current month
        shell: bash
        run: |
          CMD=(python scripts/sync_courier_route_performance_details.py --year "${{ steps.period.outputs.year }}" --month "${{ steps.period.outputs.month }}" --only-shifts)

          if [ "${{ steps.period.outputs.dry_run }}" != "true" ]; then
            CMD+=(--apply)
          fi

          "${CMD[@]}"

      - name: Sync Courier Hub route details from latest DB day
        shell: bash
        run: |
          CMD=(python scripts/sync_courier_route_performance_details.py --year "${{ steps.period.outputs.year }}" --month "${{ steps.period.outputs.month }}" --since-last-work-date --skip-shifts)

          if [ "${{ steps.period.outputs.dry_run }}" != "true" ]; then
            CMD+=(--apply)
          fi

          "${CMD[@]}"

      - name: Upload Courier Hub auth debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-hub-auth-debug
          path: results/courier-hub-auth
          if-no-files-found: ignore
