name: Giriton Shift Delete

on:
  workflow_dispatch:
    inputs:
      serial:
        description: "Opcionális serial: MM/DD_courierId_BUDx_HH:MM"
        required: false
        default: ""
      work_date:
        description: "Datum YYYY-MM-DD"
        required: true
      warehouse:
        description: "BUD1 vagy BUD2"
        required: true
      shift_start:
        description: "Muszak kezdes HH:MM"
        required: true
      courier_id:
        description: "Courier ID"
        required: false
        default: ""
      courier_name:
        description: "Futar neve"
        required: false
        default: ""

concurrency:
  group: giriton-shift-delete
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs and secrets
        shell: bash
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "${{ inputs.work_date }}" || (echo "Missing work_date" && exit 1)
          test -n "${{ inputs.warehouse }}" || (echo "Missing warehouse" && exit 1)
          test -n "${{ inputs.shift_start }}" || (echo "Missing shift_start" && exit 1)
          if [ -z "${{ inputs.courier_id }}" ] && [ -z "${{ inputs.courier_name }}" ]; then
            echo "courier_id vagy courier_name kotelezo"
            exit 1
          fi

      - name: Run delete robot
        run: |
          robot \
            --outputdir results/giriton-shift-delete \
            --variable "DELETE_SERIAL:${{ inputs.serial }}" \
            --variable "DELETE_WORK_DATE:${{ inputs.work_date }}" \
            --variable "DELETE_WAREHOUSE:${{ inputs.warehouse }}" \
            --variable "DELETE_SHIFT_START:${{ inputs.shift_start }}" \
            --variable "DELETE_COURIER_ID:${{ inputs.courier_id }}" \
            --variable "DELETE_COURIER_NAME:${{ inputs.courier_name }}" \
            giriton_shift_delete_github.robot

      - name: Upload Robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giriton-shift-delete-results
          path: results/giriton-shift-delete
