name: Giriton Robots

concurrency:
  group: giriton-robots-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - ".github/jitt-invoice-import.trigger"
      - ".github/jitt-invoice-cleanup.trigger"
  workflow_dispatch:
    inputs:
      run_folgaltsag:
        description: "Folgaltsag robot futtatasa"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      run_girition:
        description: "Girition robot futtatasa"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      run_dsp:
        description: "DSP statisztika futtatasa"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      run_raw_export:
        description: "Uj nyers Giriton muszak export futtatasa"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_attendance:
        description: "Giriton Attendance export futtatasa"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_jitt_invoice:
        description: "JITT invoice workbook DB feltoltes"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      girition_start_date:
        description: "Girition kezdo datum YYYY-MM-DD formatumban"
        required: false
        default: ""
        type: string
      girition_days:
        description: "Girition lekerdezes napok szama"
        required: false
        default: "10"
        type: string
      dsp_start_date:
        description: "DSP kezdo datum YYYY-MM-DD formatumban"
        required: false
        default: ""
        type: string
      dsp_end_date:
        description: "DSP zaro datum YYYY-MM-DD formatumban"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 * * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"

jobs:
  cleanup_jitt_invoice:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[jitt-cleanup]') }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Remove stale JITT invoice imports
        run: |
          python scripts/cleanup_jitt_invoice_import.py \
            --keep-imported-at "$(cat .github/jitt-invoice-cleanup.trigger)"

  jitt_invoice:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[jitt-import]')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_jitt_invoice == 'true') }}
    timeout-minutes: 15

    env:
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)

      - name: Load JITT invoice workbook
        run: |
          SOURCE_URL="$(cat .github/jitt-invoice-import.trigger)"
          if [[ "$SOURCE_URL" == https://* ]]; then
            curl --fail --location "$SOURCE_URL" --output /tmp/jitt-invoice.xlsx
            python scripts/load_jitt_invoice_workbook.py --xlsx-path /tmp/jitt-invoice.xlsx
          else
            python scripts/load_jitt_invoice_workbook.py
          fi

  folgaltsag:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_folgaltsag == 'true' }}
    timeout-minutes: 45

    env:
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      GIRITION_START_DATE: ${{ github.event.inputs.girition_start_date || '' }}
      GIRITION_DAYS: ${{ github.event.inputs.girition_days || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate folgaltsag environment
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          python -c "import json, os; json.loads(os.environ['GIRITON_GOOGLE_CREDENTIALS_JSON']); print('Google credentials JSON OK')"
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Run folgaltsag robot
        run: |
          python -m robot --loglevel DEBUG --outputdir results/folgaltsag folgaltsag_github.robot

      - name: Upload robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folgaltsag-results
          path: |
            results/**
          if-no-files-found: ignore

  girition:
    runs-on: ubuntu-latest
    needs: folgaltsag
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_girition == 'true' }}
    timeout-minutes: 45

    env:
      TZ: Europe/Budapest
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITION_START_DATE: ${{ github.event.inputs.girition_start_date || '' }}
      GIRITION_DAYS: ${{ github.event.inputs.girition_days || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate girition environment
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          python -c "from urllib.parse import urlparse; import os; print('SUPABASE_HOST=' + urlparse(os.environ['SUPABASE_URL']).netloc)"
          python -c "import json, os; json.loads(os.environ['GIRITON_GOOGLE_CREDENTIALS_JSON']); print('Google credentials JSON OK')"
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Run girition robot
        run: |
          GIRITION_DAYS="${GIRITION_DAYS:-10}"
          python -m robot --loglevel DEBUG --outputdir results/girition --variable RUN_START_DATE:"$GIRITION_START_DATE" --variable DAYS_TO_SYNC:"$GIRITION_DAYS" girition_github.robot

      - name: Update shift reconciliation
        run: |
          python update_shift_reconciliation.py

      - name: Upload robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: girition-results
          path: |
            results/**
          if-no-files-found: ignore

  dsp:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '0 1 * * *' || github.event.schedule == '0 2 * * *')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_dsp == 'true') }}
    timeout-minutes: 90

    env:
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DSP_START_DATE: ${{ github.event.inputs.dsp_start_date || '' }}
      DSP_END_DATE: ${{ github.event.inputs.dsp_end_date || '' }}

    steps:
      - name: Check Budapest 03:00 window
        id: budapest_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          budapest_hour="$(TZ=Europe/Budapest date +%H)"
          echo "Budapest hour: $budapest_hour"

          if [ "$budapest_hour" = "03" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.budapest_time.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Python
        if: ${{ steps.budapest_time.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.budapest_time.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate DSP environment
        if: ${{ steps.budapest_time.outputs.should_run == 'true' }}
        run: |
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          python -c "import json, os; json.loads(os.environ['GIRITON_GOOGLE_CREDENTIALS_JSON']); print('Google credentials JSON OK')"

      - name: Run DSP statistics
        if: ${{ steps.budapest_time.outputs.should_run == 'true' }}
        run: |
          if [ -n "$DSP_START_DATE" ]; then
            raw_start="$DSP_START_DATE"
            raw_end="${DSP_END_DATE:-$DSP_START_DATE}"
            stats_month="${DSP_START_DATE:0:7}"
            dsp_args=(--start-date "$raw_start" --end-date "$raw_end")
          else
            raw_start="$(TZ=Europe/Budapest date +%Y-%m-01)"
            raw_end="$(TZ=Europe/Budapest date +%F)"
            stats_month="$(TZ=Europe/Budapest date +%Y-%m)"
            dsp_args=()
          fi

          echo "DSP raw date range: $raw_start - $raw_end"
          python dsp.py "${dsp_args[@]}"
          python scripts/load_vehicle_assignments.py
          if [ -n "$DATABASE_URL" ]; then
            python scripts/dsp_refresh_all.py
          else
            echo "DSP stage/mart SQL refresh kihagyva: nincs DATABASE_URL secret."
          fi
          python scripts/build_courier_card_stats.py --month "$stats_month"

  raw_export:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_raw_export == 'true') }}
    timeout-minutes: 45

    env:
      TZ: Europe/Budapest
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITION_START_DATE: ${{ github.event.inputs.girition_start_date || '' }}
      GIRITION_DAYS: ${{ github.event.inputs.girition_days || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate raw export environment
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          python -c "import json, os; json.loads(os.environ['GIRITON_GOOGLE_CREDENTIALS_JSON']); print('Google credentials JSON OK')"
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Run raw Giriton export robot
        run: |
          GIRITION_DAYS="${GIRITION_DAYS:-10}"
          python -m robot --loglevel DEBUG --outputdir results/raw-export --variable RUN_START_DATE:"$GIRITION_START_DATE" --variable DAYS_TO_SYNC:"$GIRITION_DAYS" giriton_raw_export_github.robot

      - name: Update shift reconciliation
        run: |
          python update_shift_reconciliation.py

      - name: Upload raw export artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-export-results
          path: |
            results/**
          if-no-files-found: ignore

  attendance:
    runs-on: ubuntu-latest
    needs: raw_export
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_attendance == 'true')) }}
    timeout-minutes: 45

    env:
      TZ: Europe/Budapest
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITION_START_DATE: ${{ github.event.inputs.girition_start_date || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate attendance environment
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          python -c "from urllib.parse import urlparse; import os; print('SUPABASE_HOST=' + urlparse(os.environ['SUPABASE_URL']).netloc)"
          python -c "import json, os; json.loads(os.environ['GIRITON_GOOGLE_CREDENTIALS_JSON']); print('Google credentials JSON OK')"
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Run Giriton attendance robot
        run: |
          GIRITION_START_DATE="${GIRITION_START_DATE:-$(TZ=Europe/Budapest date +%F)}"
          echo "Attendance date: $GIRITION_START_DATE"
          python -m robot --loglevel DEBUG --outputdir results/attendance --variable RUN_START_DATE:"$GIRITION_START_DATE" giriton_attendance_github.robot

      - name: Upload attendance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-results
          path: |
            results/**
          if-no-files-found: ignore
