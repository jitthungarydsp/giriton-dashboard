name: Discord Route Monitor

on:
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Hány percig fusson a monitor. Külső 5 perces cronhoz maradjon 0."
        required: false
        default: "0"
      poll_seconds:
        description: "Poll gyakoriság másodpercben, ha loop_minutes nagyobb mint 0."
        required: false
        default: "300"
  repository_dispatch:
    types:
      - discord-route-monitor
  schedule:
    - cron: "3,18,33,48 * * * *"

concurrency:
  group: discord-route-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_NOTIFY_COURIER_IDS: ${{ secrets.DISCORD_NOTIFY_COURIER_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate monitor environment
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || (echo "Missing DISCORD_WEBHOOK_URL secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          echo "Discord courier filter: ${DISCORD_NOTIFY_COURIER_IDS:-disabled/all couriers}"

      - name: Run Discord route monitor
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LOOP_MINUTES="14"
            POLL_SECONDS="300"
          else
            LOOP_MINUTES="${{ inputs.loop_minutes }}"
            POLL_SECONDS="${{ inputs.poll_seconds }}"
          fi

          LOOP_MINUTES="${LOOP_MINUTES:-0}"
          POLL_SECONDS="${POLL_SECONDS:-300}"

          python scripts/discord_route_monitor.py --loop-minutes "$LOOP_MINUTES" --poll-seconds "$POLL_SECONDS" --max-age-minutes 0
