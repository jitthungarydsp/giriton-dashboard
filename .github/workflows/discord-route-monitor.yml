name: Discord Route Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

concurrency:
  group: discord-route-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_NOTIFY_COURIER_IDS: ${{ secrets.DISCORD_NOTIFY_COURIER_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate monitor environment
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || (echo "Missing DISCORD_WEBHOOK_URL secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          echo "Discord courier filter: ${DISCORD_NOTIFY_COURIER_IDS:-disabled/all couriers}"

      - name: Run Discord route monitor
        run: |
          python scripts/discord_route_monitor.py --loop-minutes 4 --poll-seconds 60 --max-age-minutes 0
