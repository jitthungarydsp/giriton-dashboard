name: Discord Route Monitor

on:
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Hány percig fusson a monitor. Külső 5 perces cronhoz maradjon 0."
        required: false
        default: "0"
      poll_seconds:
        description: "Poll gyakoriság másodpercben, ha loop_minutes nagyobb mint 0."
        required: false
        default: "120"
  repository_dispatch:
    types:
      - discord-route-monitor
  schedule:
    # GitHub Actions sajat utemezese legalabb par perces csuszassal fut; a 2 perces ritmust cron-job.org repository_dispatch adja.
    - cron: "*/5 * * * *"

concurrency:
  group: discord-route-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DISCORD_WEBHOOK_URL_BUD1: ${{ secrets.DISCORD_WEBHOOK_URL_BUD1 }}
      DISCORD_WEBHOOK_URL_BUD2: ${{ secrets.DISCORD_WEBHOOK_URL_BUD2 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_NOTIFY_COURIER_IDS: ${{ secrets.DISCORD_NOTIFY_COURIER_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PRIVATE_KEY_B64: ${{ secrets.VAPID_PRIVATE_KEY_B64 }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      COURIER_HUB_COOKIE: ${{ secrets.COURIER_HUB_COOKIE }}
      COURIER_HUB_AUTHORIZATION: ${{ secrets.COURIER_HUB_AUTHORIZATION }}
      COURIER_HUB_API_KEY: ${{ secrets.COURIER_HUB_API_KEY }}
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      COURIER_HUB_AUTH_CACHE_FILE: /tmp/courier-hub-auth.json
      COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --debug-dir results/courier-hub-auth --cache-file /tmp/courier-hub-auth.json
      KIFLI_COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      KIFLI_COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      KIFLI_COURIER_HUB_COOKIE: ${{ secrets.COURIER_HUB_COOKIE }}
      KIFLI_COURIER_HUB_AUTHORIZATION: ${{ secrets.COURIER_HUB_AUTHORIZATION }}
      KIFLI_COURIER_HUB_API_KEY: ${{ secrets.COURIER_HUB_API_KEY }}
      KIFLI_COURIER_HUB_AUTH_CACHE_FILE: /tmp/courier-hub-auth.json
      KIFLI_COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --debug-dir results/courier-hub-auth --cache-file /tmp/courier-hub-auth.json
      GIRITON_ATTENDANCE_UIDL_URL: ${{ secrets.GIRITON_ATTENDANCE_UIDL_URL }}
      GIRITON_ATTENDANCE_UIDL_COOKIE: ${{ secrets.GIRITON_ATTENDANCE_UIDL_COOKIE }}
      GIRITON_ATTENDANCE_UIDL_CURL: ${{ secrets.GIRITON_ATTENDANCE_UIDL_CURL }}
      GIRITON_ATTENDANCE_UIDL_SEQUENCE_JSON: ${{ secrets.GIRITON_ATTENDANCE_UIDL_SEQUENCE_JSON }}
      GIRITON_ATTENDANCE_UIDL_REQUEST_JSON: ${{ secrets.GIRITON_ATTENDANCE_UIDL_REQUEST_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Resolve browser paths
        shell: bash
        run: |
          CHROME_PATH="$(command -v chrome || command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          DRIVER_PATH="$(command -v chromedriver || true)"

          echo "Chrome path: ${CHROME_PATH:-missing}"
          echo "ChromeDriver path: ${DRIVER_PATH:-missing}"

          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome nem található a runneren."
            exit 1
          fi
          if [ -z "$DRIVER_PATH" ]; then
            echo "ChromeDriver nem található a runneren."
            exit 1
          fi

          "$CHROME_PATH" --version || true
          "$DRIVER_PATH" --version || true

          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$DRIVER_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate monitor environment
        run: |
          test -n "$DISCORD_WEBHOOK_URL_BUD1" || (echo "Missing DISCORD_WEBHOOK_URL_BUD1 secret" && exit 1)
          test -n "$DISCORD_WEBHOOK_URL_BUD2" || (echo "Missing DISCORD_WEBHOOK_URL_BUD2 secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$VAPID_PRIVATE_KEY$VAPID_PRIVATE_KEY_B64" || (echo "Missing VAPID_PRIVATE_KEY or VAPID_PRIVATE_KEY_B64 secret" && exit 1)
          test -n "$VAPID_SUBJECT" || (echo "Missing VAPID_SUBJECT secret" && exit 1)
          echo "Discord courier filter: ${DISCORD_NOTIFY_COURIER_IDS:-disabled/all couriers}"

      - name: Refresh Courier Hub auth
        shell: bash
        run: |
          if [ -n "$COURIER_HUB_USERNAME$COURIER_HUB_PASSWORD$COURIER_HUB_COOKIE$COURIER_HUB_AUTHORIZATION" ]; then
            python scripts/refresh_courier_hub_auth.py \
              --debug-dir results/courier-hub-auth \
              --cache-file "$COURIER_HUB_AUTH_CACHE_FILE" \
              > /tmp/courier-hub-auth-output.json
          else
            echo "Courier Hub login secrets not set, using static auth secrets."
          fi

      - name: Sync Courier Hub master roster
        continue-on-error: true
        shell: bash
        run: |
          ROSTER_DATE="$(TZ=Europe/Budapest date +%F)"
          python scripts/sync_courier_hub_master.py \
            --warehouse-ids "1,2" \
            --dsp-id 8 \
            --date "$ROSTER_DATE"

      - name: Export Courier Hub robot ids sheet
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$GIRITON_GOOGLE_CREDENTIALS_JSON" ]; then
            echo "GIRITON_GOOGLE_CREDENTIALS_JSON missing, robot id sheet export skipped."
            exit 0
          fi
          python scripts/export_courier_hub_robot_id_sheet.py

      - name: Sync Courier Hub shift blocks
        continue-on-error: true
        shell: bash
        run: |
          SHIFT_BLOCK_DATE="$(TZ=Europe/Budapest date +%F)"
          python scripts/sync_courier_hub_shift_blocks.py \
            --warehouse-ids "1,2" \
            --dsp-id 8 \
            --start-date "$SHIFT_BLOCK_DATE" \
            --lookahead-days 21

      - name: Export Courier Hub shift block capacity sheet
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$GIRITON_GOOGLE_CREDENTIALS_JSON" ]; then
            echo "GIRITON_GOOGLE_CREDENTIALS_JSON missing, capacity sheet export skipped."
            exit 0
          fi
          SHIFT_BLOCK_DATE="$(TZ=Europe/Budapest date +%F)"
          python scripts/export_courier_hub_shift_block_capacity_sheet.py \
            --start-date "$SHIFT_BLOCK_DATE" \
            --lookahead-days 21

      - name: Export Courier Hub shift bookings sheet
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$GIRITON_GOOGLE_CREDENTIALS_JSON" ]; then
            echo "GIRITON_GOOGLE_CREDENTIALS_JSON missing, shift bookings sheet export skipped."
            exit 0
          fi
          SHIFT_BLOCK_DATE="$(TZ=Europe/Budapest date +%F)"
          python scripts/export_courier_hub_shift_bookings_sheet.py \
            --start-date "$SHIFT_BLOCK_DATE" \
            --lookahead-days 21

      - name: Sync Courier Hub live monitoring snapshots
        continue-on-error: true
        shell: bash
        run: |
          python scripts/sync_courier_hub_live_monitoring.py \
            --warehouse-ids "1,2" \
            --dsp-id 8 \
            --detail-scope all

      - name: Sync Giriton Attendance UIDL
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/giriton_attendance_uidl_sync.py --require-rows --debug-dir results/giriton-attendance-uidl

      - name: Upload Giriton Attendance UIDL debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giriton-attendance-uidl-debug
          path: results/giriton-attendance-uidl
          if-no-files-found: ignore

      - name: Run Discord route monitor
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LOOP_MINUTES="0"
            POLL_SECONDS="120"
          else
            LOOP_MINUTES="${{ inputs.loop_minutes }}"
            POLL_SECONDS="${{ inputs.poll_seconds }}"
          fi

          LOOP_MINUTES="${LOOP_MINUTES:-0}"
          POLL_SECONDS="${POLL_SECONDS:-120}"

          python scripts/discord_route_monitor.py --loop-minutes "$LOOP_MINUTES" --poll-seconds "$POLL_SECONDS" --max-age-minutes 0

      - name: Upload Courier Hub auth debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-hub-auth-debug
          path: results/courier-hub-auth
          if-no-files-found: ignore
