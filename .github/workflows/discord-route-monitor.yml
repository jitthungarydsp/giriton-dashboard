name: Discord Route Monitor

on:
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Hány percig fusson a monitor. Külső 5 perces cronhoz maradjon 0."
        required: false
        default: "0"
      poll_seconds:
        description: "Poll gyakoriság másodpercben, ha loop_minutes nagyobb mint 0."
        required: false
        default: "120"
  repository_dispatch:
    types:
      - discord-route-monitor
  schedule:
    - cron: "3,18,33,48 * * * *"

concurrency:
  group: discord-route-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DISCORD_WEBHOOK_URL_BUD1: ${{ secrets.DISCORD_WEBHOOK_URL_BUD1 }}
      DISCORD_WEBHOOK_URL_BUD2: ${{ secrets.DISCORD_WEBHOOK_URL_BUD2 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_NOTIFY_COURIER_IDS: ${{ secrets.DISCORD_NOTIFY_COURIER_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PRIVATE_KEY_B64: ${{ secrets.VAPID_PRIVATE_KEY_B64 }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      COURIER_HUB_COOKIE: ${{ secrets.COURIER_HUB_COOKIE }}
      COURIER_HUB_AUTHORIZATION: ${{ secrets.COURIER_HUB_AUTHORIZATION }}
      COURIER_HUB_API_KEY: ${{ secrets.COURIER_HUB_API_KEY }}
      COURIER_HUB_AUTH_CACHE_FILE: /tmp/courier-hub-auth.json
      COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --debug-dir results/courier-hub-auth --cache-file /tmp/courier-hub-auth.json
      KIFLI_COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      KIFLI_COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      KIFLI_COURIER_HUB_COOKIE: ${{ secrets.COURIER_HUB_COOKIE }}
      KIFLI_COURIER_HUB_AUTHORIZATION: ${{ secrets.COURIER_HUB_AUTHORIZATION }}
      KIFLI_COURIER_HUB_API_KEY: ${{ secrets.COURIER_HUB_API_KEY }}
      KIFLI_COURIER_HUB_AUTH_CACHE_FILE: /tmp/courier-hub-auth.json
      KIFLI_COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --debug-dir results/courier-hub-auth --cache-file /tmp/courier-hub-auth.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate monitor environment
        run: |
          test -n "$DISCORD_WEBHOOK_URL_BUD1" || (echo "Missing DISCORD_WEBHOOK_URL_BUD1 secret" && exit 1)
          test -n "$DISCORD_WEBHOOK_URL_BUD2" || (echo "Missing DISCORD_WEBHOOK_URL_BUD2 secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$VAPID_PRIVATE_KEY$VAPID_PRIVATE_KEY_B64" || (echo "Missing VAPID_PRIVATE_KEY or VAPID_PRIVATE_KEY_B64 secret" && exit 1)
          test -n "$VAPID_SUBJECT" || (echo "Missing VAPID_SUBJECT secret" && exit 1)
          echo "Discord courier filter: ${DISCORD_NOTIFY_COURIER_IDS:-disabled/all couriers}"

      - name: Refresh Courier Hub auth
        shell: bash
        run: |
          if [ -n "$COURIER_HUB_USERNAME$COURIER_HUB_PASSWORD$COURIER_HUB_COOKIE$COURIER_HUB_AUTHORIZATION" ]; then
            python scripts/refresh_courier_hub_auth.py \
              --debug-dir results/courier-hub-auth \
              --cache-file "$COURIER_HUB_AUTH_CACHE_FILE" \
              > /tmp/courier-hub-auth-output.json
          else
            echo "Courier Hub login secrets not set, using static auth secrets."
          fi

      - name: Run Discord route monitor
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LOOP_MINUTES="14"
            POLL_SECONDS="120"
          else
            LOOP_MINUTES="${{ inputs.loop_minutes }}"
            POLL_SECONDS="${{ inputs.poll_seconds }}"
          fi

          LOOP_MINUTES="${LOOP_MINUTES:-0}"
          POLL_SECONDS="${POLL_SECONDS:-120}"

          python scripts/discord_route_monitor.py --loop-minutes "$LOOP_MINUTES" --poll-seconds "$POLL_SECONDS" --max-age-minutes 0

      - name: Upload Courier Hub auth debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-hub-auth-debug
          path: results/courier-hub-auth
          if-no-files-found: ignore
