name: JITT Invoice Performance Raw

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Elso nap, amit betoltunk."
        required: false
        default: "2026-06-01"
      end_date:
        description: "Utolso nap. Uresen hagyva a mai Budapest szerinti nap."
        required: false
        default: ""
      warehouse_ids:
        description: "Raktar ID-k vesszovel elvalasztva: 1=BUD1, 2=BUD2."
        required: false
        default: "1,2"
      chunk_days:
        description: "Hany nap legyen egy API hivasban."
        required: false
        default: "7"
      save_http_errors:
        description: "HTTP hiba valaszokat is mentse raw sorba."
        required: false
        default: "false"
  schedule:
    - cron: "35 2 * * *"

concurrency:
  group: jitt-invoice-performance-raw
  cancel-in-progress: false

jobs:
  import-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KIFLI_COURIER_HUB_AUTHORIZATION: ${{ secrets.KIFLI_COURIER_HUB_AUTHORIZATION }}
      KIFLI_COURIER_HUB_BEARER_TOKEN: ${{ secrets.KIFLI_COURIER_HUB_BEARER_TOKEN }}
      KIFLI_COURIER_HUB_COOKIE: ${{ secrets.KIFLI_COURIER_HUB_COOKIE }}
      KIFLI_COURIER_HUB_API_KEY: ${{ secrets.KIFLI_COURIER_HUB_API_KEY }}
      KIFLI_COURIER_HUB_EXTRA_HEADERS_JSON: ${{ secrets.KIFLI_COURIER_HUB_EXTRA_HEADERS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$KIFLI_COURIER_HUB_AUTHORIZATION$KIFLI_COURIER_HUB_BEARER_TOKEN$KIFLI_COURIER_HUB_COOKIE$KIFLI_COURIER_HUB_API_KEY$KIFLI_COURIER_HUB_EXTRA_HEADERS_JSON" || (echo "Missing Courier Hub auth secret" && exit 1)

      - name: Load Courier Hub performance raw
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            START_DATE="2026-06-01"
            END_DATE=""
            WAREHOUSE_IDS="1,2"
            CHUNK_DAYS="7"
            SAVE_HTTP_ERRORS="false"
          else
            START_DATE="${{ inputs.start_date }}"
            END_DATE="${{ inputs.end_date }}"
            WAREHOUSE_IDS="${{ inputs.warehouse_ids }}"
            CHUNK_DAYS="${{ inputs.chunk_days }}"
            SAVE_HTTP_ERRORS="${{ inputs.save_http_errors }}"
          fi

          args=(
            --start-date "$START_DATE"
            --warehouse-ids "$WAREHOUSE_IDS"
            --chunk-days "$CHUNK_DAYS"
          )

          if [ -n "$END_DATE" ]; then
            args+=(--end-date "$END_DATE")
          fi

          if [ "$SAVE_HTTP_ERRORS" = "true" ]; then
            args+=(--save-http-errors)
          fi

          python scripts/load_jitt_invoice_performance_raw.py "${args[@]}"
