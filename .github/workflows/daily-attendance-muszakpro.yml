name: Daily Attendance MuszakPro Refresh

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Hany napot frissitsen a mai naptol."
        required: false
        default: "5"
      start_date:
        description: "Opcionális kezdo nap YYYY-MM-DD formatumban."
        required: false
        default: ""
      dry_run:
        description: "Csak probafutas, DB iras/torles nelkul."
        required: false
        default: "false"
  schedule:
    # GitHub cron UTC-ben fut. Nyari budapesti ido szerint 06:30.
    - cron: "30 4 * * *"

concurrency:
  group: daily-attendance-muszakpro-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)

      - name: Refresh next day attendance MuszakPro comparison
        run: |
          DAYS="${{ inputs.days }}"
          START_DATE="${{ inputs.start_date }}"
          DRY_RUN="${{ inputs.dry_run }}"

          DAYS="${DAYS:-5}"
          DRY_RUN="${DRY_RUN:-false}"

          CMD=(python scripts/refresh_next_5_day_attendance_muszakpro.py --days "$DAYS")

          if [ -n "$START_DATE" ]; then
            CMD+=(--start-date "$START_DATE")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
