name: Daily Attendance MuszakPro Refresh

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Hany napot frissitsen a mai naptol."
        required: false
        default: "5"
      start_date:
        description: "Opcionális kezdo nap YYYY-MM-DD formatumban."
        required: false
        default: ""
      dry_run:
        description: "Csak probafutas, DB iras/torles nelkul."
        required: false
        default: "false"
  schedule:
    # GitHub cron UTC-ben fut. Az 5 napos műszakfrissítő óránként fut.
    - cron: "0 * * * *"

concurrency:
  group: daily-attendance-muszakpro-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PRIVATE_KEY_B64: ${{ secrets.VAPID_PRIVATE_KEY_B64 }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          DRY_RUN="${{ inputs.dry_run }}"
          DRY_RUN="${DRY_RUN:-false}"
          if [ "$DRY_RUN" != "true" ]; then
            test -n "$VAPID_PRIVATE_KEY$VAPID_PRIVATE_KEY_B64" || (echo "Missing VAPID_PRIVATE_KEY or VAPID_PRIVATE_KEY_B64 secret" && exit 1)
            test -n "$VAPID_SUBJECT" || (echo "Missing VAPID_SUBJECT secret" && exit 1)
          fi

      - name: Refresh next day attendance MuszakPro comparison
        run: |
          DAYS="${{ inputs.days }}"
          START_DATE="${{ inputs.start_date }}"
          DRY_RUN="${{ inputs.dry_run }}"

          DAYS="${DAYS:-5}"
          DRY_RUN="${DRY_RUN:-false}"

          CMD=(python scripts/refresh_next_5_day_attendance_muszakpro.py --days "$DAYS")

          if [ -n "$START_DATE" ]; then
            CMD+=(--start-date "$START_DATE")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Send new shift push notifications
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          python scripts/send_tomorrow_shift_push.py --mode new-shifts --days 5
