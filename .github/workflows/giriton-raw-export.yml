name: Giriton Raw Export

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Kezdo datum YYYY-MM-DD, uresen holnap"
        required: false
        default: ""
      days:
        description: "Hany napot kerjen le"
        required: true
        default: "10"
      export_engine:
        description: "uidl = új gyors lekérés, robot = régi UI végignyomkodás"
        required: false
        default: "uidl"
  schedule:
    # GitHub cron UTC-ben fut. A Giriton műszak raw export óránként, a MűszakPro frissítés után fut.
    - cron: "20 * * * *"

concurrency:
  group: giriton-raw-export
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)

      - name: Run raw export
        shell: bash
        run: |
          START_DATE="${{ inputs.start_date }}"
          DAYS="${{ inputs.days }}"
          EXPORT_ENGINE="${{ inputs.export_engine }}"
          START_DATE="${START_DATE:-}"
          DAYS="${DAYS:-10}"
          EXPORT_ENGINE="${EXPORT_ENGINE:-uidl}"
          if [ -z "$START_DATE" ]; then
            START_DATE="$(python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("Europe/Budapest")).date() + timedelta(days=1)).isoformat())')"
          fi

          if [ "$EXPORT_ENGINE" = "uidl" ]; then
            python scripts/live_giriton_shift_list.py \
              --start-date "$START_DATE" \
              --days "$DAYS" \
              --source uidl \
              --fast-uidl \
              --uidl-dir results/giriton-raw-export/uidl-trace \
              --csv results/giriton-raw-export/giriton-live-shifts.csv \
              --write-raw-export
          else
            robot \
              --outputdir results/giriton-raw-export \
              --variable "RUN_START_DATE:$START_DATE" \
              --variable "DAYS_TO_SYNC:$DAYS" \
              giriton_raw_export_github.robot
          fi

          python scripts/refresh_shift_comparison.py \
            --start-date "$START_DATE" \
            --days "$DAYS"

      - name: Upload Robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giriton-raw-export-results
          path: results/giriton-raw-export
