name: PWA_SCHEDULE_BULK
run-name: PWA batch ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Private, validated daily operation list UUID"
        required: true

concurrency:
  group: pwa-schedule-bulk-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COURIER_HUB_COOKIE: ${{ secrets.COURIER_HUB_COOKIE }}
      COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      COURIER_HUB_AUTH_CACHE_FILE: /tmp/pwa-schedule-bulk-auth.json
      COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --cache-file /tmp/pwa-schedule-bulk-auth.json --debug-dir results/pwa-schedule-bulk/auth
      KIFLI_COURIER_HUB_USERNAME: ${{ secrets.COURIER_HUB_USERNAME }}
      KIFLI_COURIER_HUB_PASSWORD: ${{ secrets.COURIER_HUB_PASSWORD }}
      KIFLI_COURIER_HUB_AUTH_CACHE_FILE: /tmp/pwa-schedule-bulk-auth.json
      KIFLI_COURIER_HUB_AUTH_REFRESH_COMMAND: python scripts/refresh_courier_hub_auth.py --cache-file /tmp/pwa-schedule-bulk-auth.json --debug-dir results/pwa-schedule-bulk/auth

      PWA_BATCH_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute selected Hub operations and refresh the day
        run: python scripts/run_pwa_schedule_bulk.py
