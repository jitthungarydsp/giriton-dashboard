name: Daily Courier Financial Overview

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Ev, pelda: 2026. Uresen: aktualis ev Budapest szerint."
        required: false
        default: ""
      month:
        description: "Honap 1-12. Uresen: aktualis honap Budapest szerint."
        required: false
        default: ""
      warehouse_id:
        description: "Opcionális warehouse: 1 vagy 2. Uresen: mindketto."
        required: false
        default: ""
      dry_run:
        description: "true eseten nem ir DB-be."
        required: false
        default: "false"
  schedule:
    # GitHub cron UTC-ben fut. Nyari budapesti ido szerint 06:45.
    - cron: "45 4 * * *"

concurrency:
  group: daily-courier-financial-overview
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COURIER_HUB_COOKIE: ${{ secrets.COURIER_HUB_COOKIE }}
      COURIER_HUB_AUTHORIZATION: ${{ secrets.COURIER_HUB_AUTHORIZATION }}
      COURIER_HUB_API_KEY: ${{ secrets.COURIER_HUB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$COURIER_HUB_COOKIE" || (echo "Missing COURIER_HUB_COOKIE secret" && exit 1)
          test -n "$COURIER_HUB_AUTHORIZATION" || (echo "Missing COURIER_HUB_AUTHORIZATION secret" && exit 1)

      - name: Resolve period
        id: period
        shell: bash
        run: |
          YEAR="${{ inputs.year }}"
          MONTH="${{ inputs.month }}"
          WAREHOUSE_ID="${{ inputs.warehouse_id }}"
          DRY_RUN="${{ inputs.dry_run }}"

          YEAR="${YEAR:-$(TZ=Europe/Budapest date +%Y)}"
          MONTH="${MONTH:-$(TZ=Europe/Budapest date +%-m)}"
          DRY_RUN="${DRY_RUN:-false}"

          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "warehouse_id=$WAREHOUSE_ID" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          echo "YEAR=$YEAR"
          echo "MONTH=$MONTH"
          echo "WAREHOUSE_ID=${WAREHOUSE_ID:-all}"
          echo "DRY_RUN=$DRY_RUN"

      - name: Sync Courier Hub financial overview raw
        run: |
          CMD=(python scripts/sync_courier_financial_overview.py --year "${{ steps.period.outputs.year }}" --month "${{ steps.period.outputs.month }}")

          if [ "${{ steps.period.outputs.dry_run }}" != "true" ]; then
            CMD+=(--apply)
          fi

          if [ -n "${{ steps.period.outputs.warehouse_id }}" ]; then
            CMD+=(--warehouse-id "${{ steps.period.outputs.warehouse_id }}")
          fi

          echo "Running financial overview sync."
          "${CMD[@]}"
