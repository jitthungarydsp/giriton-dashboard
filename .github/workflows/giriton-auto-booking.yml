name: Giriton Auto Booking

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "T hanyadik napjat nezze. 3 = T+3."
        required: false
        default: "3"
      horizon_days:
        description: "Hany napot dolgozzon fel a kezdo naptol."
        required: false
        default: "1"
      start_date:
        description: "Opcionalis kezdo datum YYYY-MM-DD. Ha ures, T+days_ahead."
        required: false
        default: ""
      end_date:
        description: "Opcionalis zaro datum YYYY-MM-DD."
        required: false
        default: ""
      dry_run:
        description: "true = csak keres es logol, nem kattint elesen."
        required: false
        default: "true"

concurrency:
  group: giriton-auto-booking
  cancel-in-progress: false

jobs:
  auto-booking:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)

      - name: Run Giriton auto booking dry-run
        run: |
          python -m robot \
            --loglevel DEBUG \
            --outputdir results/giriton-auto-booking \
            --variable AUTO_BOOK_DAYS_AHEAD:"${{ inputs.days_ahead }}" \
            --variable AUTO_BOOK_HORIZON_DAYS:"${{ inputs.horizon_days }}" \
            --variable AUTO_BOOK_START_DATE:"${{ inputs.start_date }}" \
            --variable AUTO_BOOK_END_DATE:"${{ inputs.end_date }}" \
            --variable AUTO_BOOK_DRY_RUN:"${{ inputs.dry_run }}" \
            giriton_auto_booking_github.robot

      - name: Upload Robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giriton-auto-booking-results
          path: results/giriton-auto-booking
