name: Giriton Auto Booking

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Kezdo datum YYYY-MM-DD"
        required: true
      end_date:
        description: "Zaro datum YYYY-MM-DD"
        required: true
      serial:
        description: "Opcionális Foglalasok serial. Eles modhoz kotelezo."
        required: false
        default: ""
      warehouse:
        description: "Opcionális raktár szűrő: BUD1 vagy BUD2. Tömeges éles módhoz kötelező."
        required: false
        default: ""
      email:
        description: "Opcionális célzott futár email szűrő."
        required: false
        default: ""
      courier_id:
        description: "Opcionális célzott futár ID az új UIDL úthoz."
        required: false
        default: ""
      shift_start:
        description: "Opcionális célzott műszakkezdés HH:MM."
        required: false
        default: ""
      dry_run:
        description: "true = csak ellenorzes, false = eles foglalas"
        required: true
        default: "true"
      booking_engine:
        description: "uidl = új út, robot = régi képernyős tartalék"
        required: false
        default: "uidl"
      courier_name:
        description: "Opcionális futárnév az új UIDL úthoz."
        required: false
        default: ""

concurrency:
  group: giriton-auto-booking
  cancel-in-progress: false
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GIRITON_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GIRITON_GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs and secrets
        shell: bash
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$GIRITON_GOOGLE_CREDENTIALS_JSON" || (echo "Missing GIRITON_GOOGLE_CREDENTIALS_JSON secret" && exit 1)

          if [ "${{ inputs.dry_run }}" != "true" ] && [ -z "${{ inputs.serial }}" ] && [ -z "${{ inputs.warehouse }}" ]; then
            echo "Eles Giriton foglalashoz kotelezo konkret serialt vagy raktar szurot megadni."
            exit 1
          fi

          if [ "${{ inputs.dry_run }}" != "true" ] && [ -n "${{ inputs.serial }}" ] && [ "${{ inputs.booking_engine }}" = "uidl" ]; then
            if [ -z "${{ inputs.courier_id }}" ] && [ -z "${{ inputs.email }}" ] && [ -z "${{ inputs.courier_name }}" ]; then
              echo "Celjzott UIDL eles foglalashoz courier_id, email vagy futarnev is kell."
              exit 1
            fi
            test -n "${{ inputs.warehouse }}" || (echo "Celjzott eles foglalashoz raktar is kell." && exit 1)
            test -n "${{ inputs.shift_start }}" || (echo "Celjzott eles foglalashoz muszakkezdes is kell." && exit 1)
          fi

          if [ "${{ inputs.dry_run }}" != "true" ] && [ -n "${{ inputs.serial }}" ] && [ "${{ inputs.booking_engine }}" != "uidl" ]; then
            test -n "${{ inputs.email }}" || (echo "Celjzott robot eles foglalashoz email is kell." && exit 1)
            test -n "${{ inputs.warehouse }}" || (echo "Celjzott eles foglalashoz raktar is kell." && exit 1)
            test -n "${{ inputs.shift_start }}" || (echo "Celjzott eles foglalashoz muszakkezdes is kell." && exit 1)
          fi

      - name: Run Giriton auto booking robot
        if: ${{ inputs.booking_engine != 'uidl' }}
        run: |
          robot \
            --outputdir results/giriton-auto-booking \
            --variable AUTO_BOOK_START_DATE:${{ inputs.start_date }} \
            --variable AUTO_BOOK_END_DATE:${{ inputs.end_date }} \
            --variable AUTO_BOOK_DRY_RUN:${{ inputs.dry_run }} \
            --variable AUTO_BOOK_SERIAL:${{ inputs.serial }} \
            --variable AUTO_BOOK_WAREHOUSE:${{ inputs.warehouse }} \
            --variable AUTO_BOOK_EMAIL:${{ inputs.email }} \
            --variable AUTO_BOOK_SHIFT_START:${{ inputs.shift_start }} \
            giriton_auto_booking_github.robot

      - name: Run Giriton UIDL booking path
        if: ${{ inputs.booking_engine == 'uidl' }}
        shell: bash
        run: |
          CMD=(python scripts/giriton_uidl_fast_book.py \
            --date "${{ inputs.start_date }}" \
            --warehouse "${{ inputs.warehouse }}" \
            --shift-start "${{ inputs.shift_start }}" \
            --courier-id "${{ inputs.courier_id }}" \
            --serial "${{ inputs.serial }}" \
            --courier-name "${{ inputs.courier_name }}" \
            --email "${{ inputs.email }}" \
            --trace-dir results/giriton-auto-booking/uidl-trace \
            --output-dir results/giriton-auto-booking/robot)

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD+=(--dry-run)
          else
            CMD+=(--live)
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Upload Robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giriton-auto-booking-robot-results
          path: results/giriton-auto-booking
