name: Morning invoice notifications

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Europe/Budapest
  workflow_dispatch:
    inputs:
      retry_delivery_id:
        description: 'Kifejezetten jóváhagyott, nem igazolt napi riport újraküldése (UUID); üresen a szokásos várólista'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: morning-invoice-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-account-worker.txt
            requirements.txt
      - name: Install notification dependencies
        run: pip install -r requirements-account-worker.txt 'supabase>=2.15.3'
      - name: Send pending invoice notifications
        run: |
          if [ -n "$RETRY_DELIVERY_ID" ]; then
            python scripts/retry_invoice_digest.py --delivery-id "$RETRY_DELIVERY_ID"
          else
            python devtest.py --invoice-notifications-once
          fi
        env:
          RETRY_DELIVERY_ID: ${{ inputs.retry_delivery_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USE_STARTTLS: 'true'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_USERNAME }}
          SMTP_FROM_NAME: JittFutár
