name: Giriton Attendance Refresh

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Opcionális dátum YYYY-MM-DD formátumban. Üresen a mai nap."
        required: false
        default: ""
  repository_dispatch:
    types:
      - giriton-attendance-refresh
  schedule:
    # GitHub cron UTC-ben fut es keshet. Pontos 15 perces inditashoz
    # cron-job.org repository_dispatch is hasznalhato: giriton-attendance-refresh.
    - cron: "*/15 * * * *"

concurrency:
  group: giriton-attendance-refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Europe/Budapest
      GIRITON_USER: ${{ secrets.GIRITON_USER }}
      GIRITON_PASSWORD: ${{ secrets.GIRITON_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Resolve browser paths
        shell: bash
        run: |
          CHROME_PATH="$(command -v chrome || command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          DRIVER_PATH="$(command -v chromedriver || true)"

          echo "Chrome path: ${CHROME_PATH:-missing}"
          echo "ChromeDriver path: ${DRIVER_PATH:-missing}"

          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome nem található a runneren."
            exit 1
          fi
          if [ -z "$DRIVER_PATH" ]; then
            echo "ChromeDriver nem található a runneren."
            exit 1
          fi

          "$CHROME_PATH" --version || true
          "$DRIVER_PATH" --version || true

          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$DRIVER_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$GIRITON_USER" || (echo "Missing GIRITON_USER secret" && exit 1)
          test -n "$GIRITON_PASSWORD" || (echo "Missing GIRITON_PASSWORD secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)

      - name: Run attendance refresh
        shell: bash
        run: |
          START_DATE="${{ github.event.inputs.start_date }}"
          START_DATE="${START_DATE:-}"

          CMD=(robot --outputdir results/giriton-attendance)

          if [ -n "$START_DATE" ]; then
            CMD+=(--variable "RUN_START_DATE:$START_DATE")
          fi

          CMD+=(giriton_attendance_github.robot)

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Upload Robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giriton-attendance-results
          path: results/giriton-attendance
