name: Hourly Exact Shift Auto Booking

on:
  workflow_dispatch:
    inputs:
      min_lead_hours:
        description: "Minimum hany oraval kesobbi pontos egyezeseket inditson."
        required: false
        default: "72"
      lookahead_days:
        description: "Hany napra elore nezzen adatot."
        required: false
        default: "5"
      limit:
        description: "Maximum hany celzott foglalast inditson egy futasban."
        required: false
        default: "50"
      dry_run:
        description: "true = csak lista, false = eles inditas"
        required: false
        default: "false"
  schedule:
    # GitHub cron UTC-ben fut. A forrasfrissitesek utan indul, csak T+72h utani pontos egyezesekre.
    - cron: "25 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: hourly-exact-shift-auto-booking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GITHUB_REF: ${{ github.ref_name }}

    steps:
      - name: Validate environment
        run: |
          test -n "$GITHUB_TOKEN" || (echo "Missing GITHUB_TOKEN" && exit 1)

      - name: Dispatch one exact-only robot run after T+72 hours
        run: |
          MIN_LEAD_HOURS="${{ inputs.min_lead_hours }}"
          LOOKAHEAD_DAYS="${{ inputs.lookahead_days }}"
          DRY_RUN="${{ inputs.dry_run }}"

          MIN_LEAD_HOURS="${MIN_LEAD_HOURS:-72}"
          LOOKAHEAD_DAYS="${LOOKAHEAD_DAYS:-5}"
          DRY_RUN="${DRY_RUN:-false}"

          LEAD_DAYS=$(( (MIN_LEAD_HOURS + 23) / 24 ))
          if [ "$LEAD_DAYS" -lt 1 ]; then
            LEAD_DAYS=1
          fi

          START_DATE=$(TZ=Europe/Budapest date -d "+${LEAD_DAYS} days" +%F)
          END_DATE=$(TZ=Europe/Budapest date -d "+${LOOKAHEAD_DAYS} days" +%F)

          echo "Dispatching one exact-only robot run: start=${START_DATE} end=${END_DATE} dry_run=${DRY_RUN}"

          HTTP_STATUS=$(curl -sS -o /tmp/dispatch-response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/giriton-auto-booking.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF}\",\"inputs\":{\"start_date\":\"${START_DATE}\",\"end_date\":\"${END_DATE}\",\"serial\":\"\",\"warehouse\":\"\",\"email\":\"\",\"shift_start\":\"\",\"exact_only\":\"true\",\"dry_run\":\"${DRY_RUN}\"}}")

          if [ "$HTTP_STATUS" != "204" ]; then
            echo "Dispatch failed with HTTP ${HTTP_STATUS}"
            cat /tmp/dispatch-response.txt
            exit 1
          fi
