name: Hourly Exact Shift Auto Booking

on:
  workflow_dispatch:
    inputs:
      horizon_hours:
        description: "Hany oran beluli pontos egyezeseket inditson."
        required: false
        default: "72"
      limit:
        description: "Maximum hany celzott foglalast inditson egy futasban."
        required: false
        default: "50"
      dry_run:
        description: "true = csak lista, false = eles inditas"
        required: false
        default: "false"
  schedule:
    # GitHub cron UTC-ben fut. A forrasfrissitesek utan indul, csak T+72h pontos egyezesekre.
    - cron: "25 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: hourly-exact-shift-auto-booking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GITHUB_REF: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "Missing GITHUB_TOKEN" && exit 1)

      - name: Dispatch exact matches in next 72 hours
        run: |
          HORIZON_HOURS="${{ inputs.horizon_hours }}"
          LIMIT="${{ inputs.limit }}"
          DRY_RUN="${{ inputs.dry_run }}"

          HORIZON_HOURS="${HORIZON_HOURS:-72}"
          LIMIT="${LIMIT:-50}"
          DRY_RUN="${DRY_RUN:-false}"

          CMD=(python scripts/auto_book_exact_shift_matches.py --horizon-hours "$HORIZON_HOURS" --limit "$LIMIT")

          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
