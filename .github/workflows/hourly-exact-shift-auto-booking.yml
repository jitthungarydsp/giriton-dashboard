name: Hourly Exact Shift Auto Booking

on:
  workflow_dispatch:
    inputs:
      min_lead_hours:
        description: "Minimum hany oraval kesobbi pontos egyezeseket inditson. 0 = aznapi is mehet."
        required: false
        default: "0"
      lookahead_days:
        description: "Hany napra elore nezzen adatot."
        required: false
        default: "5"
      limit:
        description: "Maximum hany celzott foglalast inditson egy futasban."
        required: false
        default: "50"
      dry_run:
        description: "true = csak lista, false = eles inditas"
        required: false
        default: "false"
  schedule:
    # GitHub cron UTC-ben fut. A MűszakPro és Giriton forrásfrissítések után indul.
    - cron: "40 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: hourly-exact-shift-auto-booking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GITHUB_REF: ${{ github.ref_name }}
      DISCORD_FAILED_SHIFT_REQUEST_WEBHOOK_URL: ${{ secrets.DISCORD_FAILED_SHIFT_REQUEST_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "Missing GITHUB_TOKEN" && exit 1)

      - name: Dispatch exact matches
        run: |
          MIN_LEAD_HOURS="${{ inputs.min_lead_hours }}"
          LOOKAHEAD_DAYS="${{ inputs.lookahead_days }}"
          LIMIT="${{ inputs.limit }}"
          DRY_RUN="${{ inputs.dry_run }}"

          MIN_LEAD_HOURS="${MIN_LEAD_HOURS:-0}"
          LOOKAHEAD_DAYS="${LOOKAHEAD_DAYS:-5}"
          LIMIT="${LIMIT:-50}"
          DRY_RUN="${DRY_RUN:-false}"

          CMD=(python scripts/auto_book_exact_shift_matches.py --min-lead-hours "$MIN_LEAD_HOURS" --lookahead-days "$LOOKAHEAD_DAYS" --limit "$LIMIT")

          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Notify failed manual shift requests
        if: ${{ always() }}
        shell: bash
        run: |
          LOOKAHEAD_DAYS="${{ inputs.lookahead_days }}"
          DRY_RUN="${{ inputs.dry_run }}"

          LOOKAHEAD_DAYS="${LOOKAHEAD_DAYS:-5}"
          DRY_RUN="${DRY_RUN:-false}"
          START_DATE="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Europe/Budapest")).date().isoformat())')"
          END_DATE="$(LOOKAHEAD_DAYS="$LOOKAHEAD_DAYS" python -c 'import os; from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("Europe/Budapest")).date() + timedelta(days=max(int(os.environ.get("LOOKAHEAD_DAYS", "5")), 1))).isoformat())')"

          CMD=(python scripts/notify_failed_shift_requests.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --tolerance-minutes 0)

          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
