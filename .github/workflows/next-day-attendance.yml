name: Next Day Attendance Monitor

on:
  push:
    paths:
      - ".github/workflows/next-day-attendance.yml"
      - "scripts/next_day_attendance_monitor.py"
      - "docs/next_day_attendance_tables.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "snapshot = holnapi lista; compare = mai megjelenes ellenorzes"
        required: true
        default: "snapshot"
        type: choice
        options:
          - snapshot
          - compare
      target_date:
        description: "Opcionális celnap YYYY-MM-DD"
        required: false
        default: ""
        type: string
      grace_minutes:
        description: "Turelmi ido a muszak kezdete utan"
        required: false
        default: "30"
        type: string
  schedule:
    - cron: "5 20 * * *"
    - cron: "0 4,5,6 * * *"

concurrency:
  group: next-day-attendance-monitor
  cancel-in-progress: false

jobs:
  attendance_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Budapest
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Validate database environment
        run: test -n "$DATABASE_URL" || (echo "Missing DATABASE_URL secret" && exit 1)

      - name: Snapshot or compare attendance
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || '' }}
          INPUT_DATE: ${{ github.event.inputs.target_date || '' }}
          INPUT_GRACE: ${{ github.event.inputs.grace_minutes || '30' }}
        run: |
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.schedule }}" = "5 20 * * *" ]; then
              MODE="snapshot"
            else
              MODE="compare"
            fi
          fi

          ARGS=(--mode "$MODE" --grace-minutes "$INPUT_GRACE")
          if [ -n "$INPUT_DATE" ]; then
            ARGS+=(--date "$INPUT_DATE")
          fi

          python scripts/next_day_attendance_monitor.py "${ARGS[@]}"
